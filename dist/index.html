<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>منصّة أشغالي</title>
<script>document.documentElement.setAttribute("dir","rtl");document.documentElement.setAttribute("lang","ar");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== منصّتي — التنسيقات ===== */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9; --border:#dde3ee;
  --text:#0f172a; --muted:#64748b; --primary:#1d4ed8; --primary-ink:#ffffff;
  --ok:#059669; --warn:#d97706; --danger:#dc2626;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
  --radius:14px; --radius-sm:10px;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#111c2e; --surface-2:#18253a; --border:#243349;
  --text:#e8eefc; --muted:#93a3bd; --primary:#3b82f6; --primary-ink:#04122b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#111c2e; --surface-2:#18253a; --border:#243349;
    --text:#e8eefc; --muted:#93a3bd; --primary:#3b82f6; --primary-ink:#04122b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.35}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none !important}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.mt{margin-top:12px}
.danger{color:var(--danger)}
.ok-text{color:var(--ok)}
.print-only{display:none}

/* ===== الشريط العلوي ===== */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--border); box-shadow:0 1px 0 rgba(0,0,0,.02);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{font-size:1.5rem}
.brand strong{display:block;font-size:1.02rem}
.brand small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;
  white-space:nowrap;font-weight:500;transition:.15s;
}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.is-active{background:var(--primary);color:var(--primary-ink)}

/* ===== أزرار ===== */
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:9px 16px;border-radius:var(--radius-sm);font-weight:500;transition:.15s;
}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{filter:brightness(1.08);background:var(--primary)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-sm{padding:6px 12px;font-size:.86rem}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.icon-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;font-size:1.05rem;
}
.icon-btn:hover{background:var(--surface-2)}
.mini-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  padding:5px 10px;border-radius:8px;font-size:.78rem;white-space:nowrap;
}
.mini-btn:hover{background:var(--surface-2);color:var(--text)}
.mini-btn.ok:hover{border-color:var(--ok);color:var(--ok)}
.mini-select{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:7px 10px;border-radius:10px;
}
.mini-select.full{width:100%;margin-top:10px}

/* ===== التخطيط ===== */
.app{max-width:940px;margin:0 auto;padding:16px 16px 64px}
.block{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.alert-block{border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-head h3{font-size:1rem}
.list{display:flex;flex-direction:column;gap:10px}

.banner{
  max-width:940px;margin:12px auto 0;padding:12px 16px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--primary) 12%,var(--surface));
  border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border));
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.banner-actions{display:flex;gap:8px;align-items:center}

/* ===== اليوم ===== */
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.hero h2{font-size:1.3rem}
.hero p{margin:2px 0 0;font-size:.85rem}
.next-up{
  background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--ctx);
  border-radius:var(--radius);padding:10px 14px;min-width:190px;box-shadow:var(--shadow);
}
.next-up small{display:block;color:var(--muted);font-size:.72rem}
.next-up strong{display:block}
.next-up span{font-size:.82rem;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow);
}
.stat-icon{font-size:1.1rem}
.stat strong{display:block;font-size:1.25rem;margin-top:2px}
.stat small{color:var(--muted);font-size:.76rem;line-height:1.3;display:block}
.stat.ok strong{color:var(--ok)}
.stat.warn strong{color:var(--warn)}
.stat.danger strong{color:var(--danger)}

/* ===== البطاقات ===== */
.card{
  background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--ctx);
  border-radius:var(--radius-sm);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
}
.card-main{flex:1;min-width:0}
.card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.card-title{font-size:.98rem;font-weight:600;word-break:break-word}
.card-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:4px}
.card-notes{margin:6px 0 0;font-size:.83rem;color:var(--muted);white-space:pre-wrap}
.card-side{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.card.is-done{opacity:.62}
.card.is-done .card-title{text-decoration:line-through}
.card.is-missed{border-inline-start-color:var(--danger)}
.card.is-overdue{background:color-mix(in srgb,var(--danger) 6%,var(--surface))}

.chip{
  background:color-mix(in srgb,var(--ctx) 14%,transparent);
  color:var(--ctx);border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;
}
:root[data-theme="dark"] .chip{color:color-mix(in srgb,var(--ctx) 70%,#fff)}
.pill{border:1px solid var(--pc);color:var(--pc);border-radius:999px;padding:1px 8px;font-size:.7rem}
.money-tag{color:var(--warn);font-weight:600}
.money-tag.paid{color:var(--ok)}

.check{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--border);
  background:var(--surface);color:#fff;flex-shrink:0;display:grid;place-items:center;
  font-size:.85rem;margin-top:2px;transition:.15s;
}
.check:hover{border-color:var(--ok)}
.task-card.is-done .check{background:var(--ok);border-color:var(--ok)}

.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty-icon{font-size:1.6rem}
.empty p{margin:6px 0 2px}
.empty small{font-size:.8rem;opacity:.85}

/* ===== التقويم ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h2{font-size:1.15rem;min-width:130px;text-align:center}
.cal-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cal-grid-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:16px;box-shadow:var(--shadow);
}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px}
.weekdays span{text-align:center;font-size:.72rem;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day-cell{
  aspect-ratio:1/1;border:1px solid transparent;background:var(--surface-2);
  border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:2px;position:relative;color:var(--text);transition:.12s;min-width:0;overflow:hidden;
}
.day-cell:hover{border-color:var(--primary)}
.day-cell.out{opacity:.32}
.day-cell.today{outline:2px solid var(--primary);outline-offset:-2px;font-weight:700}
.day-cell.selected{background:color-mix(in srgb,var(--primary) 16%,var(--surface-2))}
.day-num{font-size:.85rem}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.dots i.task-dot{background:var(--muted);width:5px;height:5px;border-radius:1px}
.more{position:absolute;bottom:2px;inset-inline-end:4px;font-size:.6rem;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted)}
.legend-item i{width:8px;height:8px;border-radius:50%;display:block}
.hijri-line{margin:-6px 0 10px}

/* ===== المهام ===== */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  padding:6px 12px;border-radius:999px;font-size:.84rem;display:flex;align-items:center;gap:6px;
}
.filter:hover{background:var(--surface-2)}
.filter.is-active{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.filter .count{
  background:color-mix(in srgb,currentColor 18%,transparent);
  border-radius:999px;padding:0 6px;font-size:.74rem;
}

/* ===== المالية ===== */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.bar{display:flex;height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%}
.bar i.pending{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,transparent 4px,transparent 8px)}

/* ===== الإعدادات ===== */
.ctx-list{display:flex;flex-direction:column;gap:8px}
.ctx-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--ctx);
  border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);
}
.ctx-row:hover{background:var(--surface-2)}
.ctx-icon{font-size:1.25rem}
.ctx-body{flex:1;min-width:0}
.ctx-body strong{display:block;font-size:.94rem}
.ctx-body small{color:var(--muted);font-size:.76rem}
.ctx-edit{color:var(--muted);font-size:.78rem}

/* ===== النماذج ===== */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:.82rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  border-radius:var(--radius-sm);padding:10px 12px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:1px;border-color:var(--primary);
}
.field textarea{resize:vertical}
.field.checkbox{flex-direction:row;align-items:center;gap:8px;padding-top:22px}
.field.checkbox input{width:18px;height:18px;flex:none}
.field.checkbox span{font-size:.86rem;color:var(--text)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.recur-box{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.day input{display:none}
.day span{
  display:inline-block;border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:4px 10px;font-size:.78rem;color:var(--muted);
}
.day input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch input{display:none}
.swatch i{
  display:block;width:28px;height:28px;border-radius:50%;background:var(--s);
  border:3px solid transparent;transition:.15s;
}
.swatch input:checked+i{border-color:var(--text);transform:scale(1.1)}
.confirm-text{margin:0 0 14px}

.quick-choice{display:grid;gap:10px}
.quick-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  padding:16px;color:var(--text);
}
.quick-btn:hover{border-color:var(--primary);background:var(--surface-2)}
.quick-btn span{font-size:1.4rem}
.quick-btn small{color:var(--muted);font-size:.8rem}

/* ===== النافذة المنبثقة ===== */
.modal-root{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
.modal{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);width:100%;max-width:560px;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:1rem}
.modal-body{padding:16px;overflow-y:auto}

/* ===== التنبيه العائم ===== */
.toast{
  position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);
  background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;
  z-index:100;font-size:.88rem;box-shadow:0 8px 30px rgba(0,0,0,.3);
}
.toast.err{background:var(--danger);color:#fff}

/* ===== التقرير ===== */
.report{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);
}
.report-head{border-bottom:2px solid var(--border);padding-bottom:14px;margin-bottom:18px}
.report-head h1{font-size:1.35rem}
.report-head p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
.report-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.report-stats .stat{box-shadow:none;background:var(--surface-2)}
.report-block{margin-bottom:24px}
.report-block>h2{
  font-size:1.02rem;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.rep-list{margin:0;padding-inline-start:20px}
.rep-list li{margin-bottom:6px}
.rep-list.small li{font-size:.86rem;margin-bottom:3px}
.rep-details{margin-top:10px}
.rep-details summary{cursor:pointer;color:var(--primary);font-size:.86rem}
.rep-details ul{margin-top:8px}

.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.compare>div{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px}
.compare small{display:block;color:var(--muted);font-size:.76rem;margin-bottom:2px}
.delta{font-weight:700;font-size:.95rem}
.delta.up{color:var(--ok)}
.delta.down{color:var(--danger)}
.delta.same{color:var(--muted);font-weight:500;font-size:.82rem}

.table-wrap{overflow-x:auto}
.rep-table{width:100%;border-collapse:collapse;font-size:.87rem;min-width:520px}
.rep-table th,.rep-table td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--border)}
.rep-table th{color:var(--muted);font-weight:600;font-size:.8rem}
.rep-table tr.dim{opacity:.45}
.rep-table .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:7px}
.rate{font-weight:700}
.rate.ok{color:var(--ok)}
.rate.mid{color:var(--warn)}
.rate.bad{color:var(--danger)}

.issue{
  background:color-mix(in srgb,var(--danger) 6%,var(--surface));
  border:1px solid color-mix(in srgb,var(--danger) 25%,var(--border));
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;
}
.issue h3{font-size:.92rem;color:var(--danger)}
.issue-detail{margin:5px 0;font-size:.84rem;color:var(--muted)}
.issue-fix{margin:6px 0 0;font-size:.86rem}
.wins h2{color:var(--ok)}
.rep-notes{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);
  border-radius:var(--radius-sm);padding:10px 12px;resize:vertical}
.report-foot{border-top:1px solid var(--border);padding-top:10px;color:var(--muted);font-size:.78rem}

.archive{display:flex;gap:8px;flex-wrap:wrap}
.archive-item{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:var(--radius-sm);padding:8px 14px;text-align:center;
}
.archive-item:hover{border-color:var(--primary)}
.archive-item small{display:block;color:var(--muted);font-size:.74rem}

/* ===== الجوال ===== */
@media (max-width:620px){
  .app{padding:12px 12px 60px}
  .card{padding:10px 12px;gap:8px}
  .card-main{flex:1 1 60%}
  .card-side{
    width:100%;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:6px;
    padding-top:8px;margin-top:4px;border-top:1px solid var(--border);
  }
  .stats{grid-template-columns:repeat(2,1fr)}
  .report{padding:16px}
  .day-cell{aspect-ratio:1/1.05}
  .hero h2{font-size:1.1rem}
  .next-up{width:100%}
}

/* ===== الطباعة ===== */
@media print{
  .topbar,.banner,.no-scroll,.no-print,.toast,.modal-root{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .app{max-width:none;padding:0}
  .report{border:0;box-shadow:none;padding:0}
  .print-only{display:block}
  .rep-notes-print{white-space:pre-wrap;border:1px solid #ccc;padding:10px;border-radius:6px}
  .report-block{break-inside:avoid}
  .rep-details[open] summary{display:none}
  .rep-details{display:block}
}

.mini-btn.miss:hover{border-color:var(--danger);color:var(--danger)}

/* ===== تفاصيل أيام التقويم على الشاشات الكبيرة ===== */
.day-events{display:none}
.more-lg{display:none}
@media (min-width:721px){
  .day-cell{
    aspect-ratio:auto;min-height:104px;align-items:stretch;justify-content:flex-start;
    padding:6px;gap:2px;
  }
  .day-num{align-self:flex-start;font-size:.8rem;color:var(--muted)}
  .day-cell.today .day-num{color:var(--primary)}
  .dots{display:none}
  .day-events{display:flex;flex-direction:column;gap:2px;overflow:hidden;width:100%;min-width:0}
  .day-ev{
    background:color-mix(in srgb,var(--ctx) 16%,transparent);
    color:var(--ctx);border-inline-start:3px solid var(--ctx);

<script>
/* أدوات عامة: التواريخ، التنسيق، المعرّفات */
(function (global) {
  'use strict';

  const WEEKDAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const WEEKDAYS_SHORT = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                  'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* --- التواريخ (نتعامل مع نص YYYY-MM-DD بتوقيت محلي) --- */
  function pad(n) { return String(n).padStart(2, '0'); }

  function toISO(date) {
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
  }

  function parseISO(iso) {
    const p = String(iso).split('-').map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }

  function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function todayISO() { return toISO(today()); }

  function addDays(iso, n) {
    const d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  function diffDays(isoA, isoB) {
    return Math.round((parseISO(isoA) - parseISO(isoB)) / 86400000);
  }

  function monthKey(iso) { return String(iso).slice(0, 7); }          // YYYY-MM
  function startOfMonth(mk) { return mk + '-01'; }
  function endOfMonth(mk) {
    const p = mk.split('-').map(Number);
    return toISO(new Date(p[0], p[1], 0));
  }
  function shiftMonth(mk, n) {
    const p = mk.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function monthLabel(mk) {
    const p = mk.split('-').map(Number);
    return MONTHS[p[1] - 1] + ' ' + p[0];
  }

  /* بداية أسبوع العمل في السعودية: الأحد */
  function startOfWeek(iso) {
    const d = parseISO(iso);
    return addDays(iso, -d.getDay());
  }

  function weekdayOf(iso) { return parseISO(iso).getDay(); }

  function hijri(iso) {
    try {
      return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {
        day: 'numeric', month: 'long', year: 'numeric'
      }).format(parseISO(iso));
    } catch (e) { return ''; }
  }

  function fmtDate(iso, opts) {
    const d = parseISO(iso);
    const long = opts && opts.long;
    const base = WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    return long ? base + ' ' + d.getFullYear() : base;
  }

  function fmtRelative(iso) {
    const n = diffDays(iso, todayISO());
    if (n === 0) return 'اليوم';
    if (n === 1) return 'غدًا';
    if (n === 2) return 'بعد يومين';
    if (n === -1) return 'أمس';
    if (n < 0) return 'متأخرة ' + Math.abs(n) + ' يوم';
    if (n <= 7) return 'بعد ' + n + ' أيام';
    return fmtDate(iso);
  }

  function fmtTime(hhmm) {
    if (!hhmm) return '';
    const p = hhmm.split(':').map(Number);
    const h = p[0], m = p[1] || 0;
    const suffix = h < 12 ? 'ص' : 'م';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + pad(m) + ' ' + suffix;
  }

  function timeRange(start, end) {
    if (!start) return 'طوال اليوم';
    return end ? fmtTime(start) + ' – ' + fmtTime(end) : fmtTime(start);
  }

  function minutesBetween(start, end) {
    if (!start || !end) return 0;
    const a = start.split(':').map(Number), b = end.split(':').map(Number);
    return Math.max(0, (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]));
  }

  function money(n, currency) {
    const v = Number(n || 0);
    return v.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + (currency || 'ر.س');
  }

  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }


  /* صياغة الجمع بالعربية: ١ مفرد، ٢ مثنى، ٣-١٠ جمع، ١١+ تمييز مفرد منصوب */
  const WORDS = {
    task:  { one: 'مهمة واحدة',  two: 'مهمتان',  few: 'مهام',    many: 'مهمة' },
    event: { one: 'موعد واحد',   two: 'موعدان',  few: 'مواعيد',  many: 'موعدًا' },
    hour:  { one: 'ساعة واحدة',  two: 'ساعتان',  few: 'ساعات',   many: 'ساعة' },
    ctx:   { one: 'مجال واحد',   two: 'مجالان',  few: 'مجالات',  many: 'مجالًا' },
    day:   { one: 'يوم واحد',    two: 'يومان',   few: 'أيام',    many: 'يومًا' },
    work:  { one: 'عمل واحد',    two: 'عملان',   few: 'أعمال',   many: 'عملًا' }
  };

  function count(n, kind) {
    const f = WORDS[kind] || WORDS.task;
    n = Number(n) || 0;
    if (n === 1) return f.one;
    if (n === 2) return f.two;
    if (n >= 3 && n <= 10) return n + ' ' + f.few;
    return n + ' ' + f.many;
  }

  function nowHHMM() {
    const d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  global.U = {
    WEEKDAYS, WEEKDAYS_SHORT, MONTHS,
    uid, pad, toISO, parseISO, today, todayISO, addDays, diffDays,
    monthKey, startOfMonth, endOfMonth, shiftMonth, monthLabel,
    startOfWeek, weekdayOf, hijri, fmtDate, fmtRelative, fmtTime, timeRange,
    minutesBetween, money, pct, escapeHTML, nowHHMM, count
  };
})(window);
/* طبقة البيانات: التخزين المحلي + العمليات على المجالات والأحداث والمهام */
(function (global) {
  'use strict';

  const KEY = 'myself.data.v1';

  const DEFAULT_CONTEXTS = [
    { id: 'ctx_watad',   name: 'فريق وتد التربوي',        color: '#2563eb', icon: '🧭', role: 'مدير الفريق' },
    { id: 'ctx_masjid',  name: 'جامع بدر الراجحي',        color: '#0d9488', icon: '🕌', role: 'مدير الشؤون التعليمية' },
    { id: 'ctx_uni',     name: 'الجامعة',                  color: '#7c3aed', icon: '🎓', role: 'طالب' },
    { id: 'ctx_aqar',    name: 'دوام العقار',              color: '#b45309', icon: '🏢', role: 'دوام' },
    { id: 'ctx_photo',   name: 'جلسات التصوير',            color: '#db2777', icon: '📸', role: 'مصوّر' },
    { id: 'ctx_jam',     name: 'الجمعية',                  color: '#059669', icon: '💼', role: 'مدير تقني' },
    { id: 'ctx_amlak',   name: 'إدارة الأملاك العقارية',   color: '#dc2626', icon: '🔑', role: 'مدير أملاك' },
    { id: 'ctx_personal',name: 'شخصي وعائلي',              color: '#475569', icon: '🏠', role: '' }
  ];

  const EVENT_TYPES = [
    { id: 'meeting', name: 'اجتماع',        icon: '👥' },
    { id: 'session', name: 'جلسة تصوير',    icon: '📸' },
    { id: 'exam',    name: 'اختبار',        icon: '📝' },
    { id: 'lecture', name: 'محاضرة',        icon: '🎓' },
    { id: 'shift',   name: 'دوام',          icon: '🏢' },
    { id: 'deadline',name: 'تسليم / بحث',   icon: '⏳' },
    { id: 'visit',   name: 'زيارة / معاينة',icon: '🚗' },
    { id: 'other',   name: 'موعد آخر',      icon: '📌' }
  ];

  const PRIORITIES = [
    { id: 'high', name: 'عالية', color: '#dc2626' },
    { id: 'mid',  name: 'متوسطة', color: '#d97706' },
    { id: 'low',  name: 'منخفضة', color: '#64748b' }
  ];

  function emptyData() {
    return {
      version: 1,
      settings: {
        name: '',
        currency: 'ر.س',
        theme: 'auto',
        lastSeenMonth: U.monthKey(U.todayISO())
      },
      contexts: DEFAULT_CONTEXTS.map(function (c) { return Object.assign({}, c); }),
      events: [],
      tasks: [],
      reports: []   // تقارير الشهور المؤرشفة
    };
  }

  let data = emptyData();
  const listeners = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        data = Object.assign(emptyData(), parsed);
        data.settings = Object.assign(emptyData().settings, parsed.settings || {});
        if (!Array.isArray(data.contexts) || !data.contexts.length) data.contexts = emptyData().contexts;
      }
    } catch (e) {
      console.warn('تعذّر قراءة البيانات المحفوظة', e);
    }
    return data;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      console.error('تعذّر الحفظ', e);
    }
    listeners.forEach(function (fn) { fn(data); });
  }

  function onChange(fn) { listeners.push(fn); }

  /* ---------- المجالات ---------- */
  function contexts() { return data.contexts; }
  function context(id) {
    return data.contexts.find(function (c) { return c.id === id; }) ||
           { id: id, name: 'بدون مجال', color: '#94a3b8', icon: '•' };
  }
  function saveContext(ctx) {
    if (ctx.id) {
      const i = data.contexts.findIndex(function (c) { return c.id === ctx.id; });
      if (i > -1) { data.contexts[i] = Object.assign(data.contexts[i], ctx); save(); return data.contexts[i]; }
    }
    ctx.id = ctx.id || U.uid('ctx');
    data.contexts.push(ctx);
    save();
    return ctx;
  }
  function deleteContext(id) {
    data.contexts = data.contexts.filter(function (c) { return c.id !== id; });
    save();
  }

  /* ---------- الأحداث ---------- */
  function events() { return data.events; }
  function event(id) { return data.events.find(function (e) { return e.id === id; }); }

  function saveEvent(ev) {
    if (ev.id && event(ev.id)) {
      Object.assign(event(ev.id), ev, { updatedAt: Date.now() });
    } else {
      ev.id = ev.id || U.uid('ev');
      ev.createdAt = Date.now();
      ev.occ = ev.occ || {};
      data.events.push(ev);
    }
    save();
    return ev;
  }

  function deleteEvent(id) {
    data.events = data.events.filter(function (e) { return e.id !== id; });
    save();
  }

  /* توليد مرات التكرار داخل مدى زمني.
     يرجع كائنات "occurrence" = { ...event, date, occId, status, paid } */
  function occurrencesBetween(fromISO, toISO_) {
    const out = [];
    data.events.forEach(function (ev) {
      dates(ev, fromISO, toISO_).forEach(function (d) {
        out.push(materialize(ev, d));
      });
    });
    out.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.start || '99:99') < (b.start || '99:99') ? -1 : 1;
    });
    return out;
  }

  function occurrencesOn(iso) { return occurrencesBetween(iso, iso); }

  function materialize(ev, date) {
    const o = ev.occ && ev.occ[date] ? ev.occ[date] : {};
    const inst = Object.assign({}, ev, {
      date: date,
      occId: ev.id + '@' + date,
      status: o.status || defaultStatus(ev, date),
      paid: o.paid != null ? o.paid : !!ev.paid,
      occNote: o.note || ''
    });
    delete inst.occ;
    return inst;
  }

  function defaultStatus(ev, date) {
    if (date < U.todayISO()) return 'pending_past';
    return 'planned';
  }

  function dates(ev, fromISO, toISO_) {
    const res = [];
    const rec = ev.recur && ev.recur.freq && ev.recur.freq !== 'none' ? ev.recur : null;
    if (!rec) {
      if (ev.date >= fromISO && ev.date <= toISO_) res.push(ev.date);
      return res;
    }
    const until = rec.until || '2099-12-31';
    const skip = rec.skip || [];
    const limit = toISO_ < until ? toISO_ : until;

    if (rec.freq === 'monthly') {
      // نثبّت اليوم من تاريخ البداية حتى لا ينزلق الشهر (٣١ ← ٣ من الشهر التالي)
      const anchor = U.parseISO(ev.date);
      const day = anchor.getDate();
      let mk = U.monthKey(fromISO > ev.date ? fromISO : ev.date);
      let guard = 0;
      while (guard++ < 400) {
        const parts = mk.split('-').map(Number);
        const lastDay = U.parseISO(U.endOfMonth(mk));
        const d = new Date(parts[0], parts[1] - 1, Math.min(day, lastDay.getDate()));
        const iso = U.toISO(d);
        if (iso > limit) break;
        if (iso >= fromISO && iso >= ev.date && !skip.includes(iso)) res.push(iso);
        mk = U.shiftMonth(mk, 1);
        if (U.startOfMonth(mk) > limit) break;
      }
      return res;
    }

    const step = rec.freq === 'daily' ? 1 : 7;
    let cur = ev.date;
    if (cur < fromISO) {
      const jumps = Math.floor(U.diffDays(fromISO, cur) / step);
      cur = U.addDays(cur, Math.max(0, jumps - 1) * step);
    }
    let guard = 0;
    while (cur <= limit && guard++ < 2000) {
      if (cur >= fromISO && cur >= ev.date && matchesRecur(ev, rec, cur) && !skip.includes(cur)) {
        res.push(cur);
      }
      cur = U.addDays(cur, 1);
    }
    return res;
  }

  function matchesRecur(ev, rec, iso) {
    if (iso < ev.date) return false;
    if (rec.freq === 'daily') return true;
    if (rec.freq === 'weekly') {
      const days = rec.days && rec.days.length ? rec.days : [U.weekdayOf(ev.date)];
      return days.includes(U.weekdayOf(iso));
    }
    if (rec.freq === 'monthly') {
      return U.parseISO(iso).getDate() === U.parseISO(ev.date).getDate();
    }
    return false;
  }

  function setOccurrence(eventId, date, patch) {
    const ev = event(eventId);
    if (!ev) return;
    ev.occ = ev.occ || {};
    ev.occ[date] = Object.assign({}, ev.occ[date], patch);
    save();
  }

  /* ---------- المهام ---------- */
  function tasks() { return data.tasks; }
  function task(id) { return data.tasks.find(function (t) { return t.id === id; }); }

  function saveTask(t) {
    if (t.id && task(t.id)) {
      Object.assign(task(t.id), t, { updatedAt: Date.now() });
    } else {
      t.id = t.id || U.uid('tk');
      t.createdAt = Date.now();
      t.done = !!t.done;
      data.tasks.push(t);
    }
    save();
    return t;
  }

  function toggleTask(id) {
    const t = task(id);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    t.doneDate = t.done ? U.todayISO() : null;
    save();
    return t;
  }

  function deleteTask(id) {
    data.tasks = data.tasks.filter(function (t) { return t.id !== id; });
    save();
  }

  /* ---------- التقارير المؤرشفة ---------- */
  function reports() { return data.reports; }
  function reportFor(mk) { return data.reports.find(function (r) { return r.month === mk; }); }
  function saveReport(r) {
    const i = data.reports.findIndex(function (x) { return x.month === r.month; });
    if (i > -1) data.reports[i] = Object.assign(data.reports[i], r);
    else data.reports.push(r);
    save();
    return r;
  }

  /* ---------- النسخ الاحتياطي ---------- */
  function exportJSON() { return JSON.stringify(data, null, 2); }

  function importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object') throw new Error('ملف غير صالح');
    data = Object.assign(emptyData(), parsed);
    data.settings = Object.assign(emptyData().settings, parsed.settings || {});
    save();
  }

  function resetAll() { data = emptyData(); save(); }

  function settings() { return data.settings; }
  function saveSettings(patch) { Object.assign(data.settings, patch); save(); }
  function raw() { return data; }

  global.Store = {
    EVENT_TYPES, PRIORITIES,
    load, save, onChange, raw, settings, saveSettings,
    contexts, context, saveContext, deleteContext,
    events, event, saveEvent, deleteEvent,
    occurrencesBetween, occurrencesOn, setOccurrence, materialize,
    tasks, task, saveTask, toggleTask, deleteTask,
    reports, reportFor, saveReport,
    exportJSON, importJSON, resetAll,
    eventType: function (id) {
      return EVENT_TYPES.find(function (t) { return t.id === id; }) || EVENT_TYPES[EVENT_TYPES.length - 1];
    },
    priority: function (id) {
      return PRIORITIES.find(function (p) { return p.id === id; }) || PRIORITIES[2];
    }
  };
})(window);
/* مكوّنات واجهة مشتركة: النافذة المنبثقة، التنبيه، بطاقات الأحداث والمهام */
(function (global) {
  'use strict';

  const modalRoot = document.getElementById('modalRoot');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function openModal(title, html, afterRender) {
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modalRoot.classList.remove('hidden');
    document.body.classList.add('no-scroll');
    if (afterRender) afterRender(modalBody);
    const first = modalBody.querySelector('input, textarea, select');
    if (first && !('ontouchstart' in window)) first.focus();
  }

  function closeModal() {
    modalRoot.classList.add('hidden');
    document.body.classList.remove('no-scroll');
    modalBody.innerHTML = '';
  }

  modalRoot.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modalRoot.classList.contains('hidden')) closeModal();
  });

  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.add('hidden'); }, 2600);
  }

  function confirmBox(message, onYes) {
    openModal('تأكيد', '<p class="confirm-text">' + U.escapeHTML(message) + '</p>' +
      '<div class="form-actions"><button class="btn btn-danger" id="cfmYes">نعم، احذف</button>' +
      '<button class="btn btn-ghost" data-close>إلغاء</button></div>',
      function (root) {
        root.querySelector('#cfmYes').onclick = function () { closeModal(); onYes(); };
      });
  }

  /* --- بطاقات --- */
  function eventCard(occ, opts) {
    opts = opts || {};
    const ctx = Store.context(occ.contextId);
    const type = Store.eventType(occ.type);
    const done = occ.status === 'done';
    const missed = occ.status === 'missed';
    const amount = Number(occ.amount || 0);
    return '' +
      '<article class="card event-card' + (done ? ' is-done' : '') + (missed ? ' is-missed' : '') + '"' +
        ' style="--ctx:' + ctx.color + '" data-ev="' + occ.id + '" data-date="' + occ.date + '">' +

      issues.push({
        title: 'مجالات نسبة الإنجاز فيها ضعيفة',
        detail: lowCtx.map(function (r) { return r.ctx.name + ' (' + r.rate + '٪)'; }).join('، '),
        fix: 'إمّا أن المهام فيها أكبر من وقتك المتاح، أو تحتاج تفويضًا. قرّر بوضوح.'
      });
    }
    if (!issues.length && isPast) {
      issues.push({ title: 'ما فيه سلبيات ظاهرة', detail: 'شهر منضبط.', fix: 'حافظ على نفس الإيقاع.' });
    }

    /* ---- توصيات ---- */
    const recs = [];
    if (completionRate < 60 && tasksOfMonth.length >= 5) {
      recs.push('قلّل عدد المهام المفتوحة شهريًا؛ نسبة إنجازك ' + completionRate + '٪ تعني أنك تعد نفسك بأكثر مما يتحمّله وقتك.');
    } else if (completionRate >= 85 && tasksOfMonth.length >= 5) {
      recs.push('نسبة إنجازك ' + completionRate + '٪ ممتازة — تقدر ترفع سقف الطموح شهر قادم.');
    }
    if (stillOverdue.length >= 3) recs.push('ابدأ الشهر بجلسة ترحيل: كل مهمة متأخرة إمّا موعد جديد أو حذف.');
    if (pending) recs.push('حدّد يومًا ثابتًا في الشهر لمتابعة التحصيل المالي.');
    if (neglected.length) recs.push('راجع مجالاتك المهملة: هل تستحق أن تبقى على قائمتك؟');
    if (overloaded.length) recs.push('اجعل حدًّا أعلى: لا أكثر من ٤ التزامات في اليوم الواحد.');
    if (unmarkedPast.length >= 3) recs.push('عوّد نفسك على «إغلاق اليوم»: مراجعة سريعة كل مساء.');
    recs.push('اكتب في أول الشهر ٣ نتائج تريد تحقيقها، وقس عليها آخر الشهر.');

    // مقارنة بالشهر السابق
    const prevMk = U.shiftMonth(mk, -1);
    const prev = quickStats(prevMk);
    const compare = {
      month: prevMk,
      tasksDone: doneTasks.length - prev.tasksDone,
      events: occs.length - prev.events,
      collected: collected - prev.collected,
      rate: completionRate - prev.rate
    };

    return {
      month: mk, isPast: isPast,
      totals: {
        tasks: tasksOfMonth.length, tasksDone: doneTasks.length, completionRate: completionRate,
        events: occs.length, doneEvents: doneEvents.length, missedEvents: missedEvents.length,
        unmarkedPast: unmarkedPast.length, attendanceRate: attendanceRate,
        hours: hours, collected: collected, pending: pending
      },
      byCtx: byCtx, active: active, neglected: neglected, busiest: busiest,
      wins: wins, issues: issues, recs: recs, compare: compare,
      doneTasks: doneTasks, openTasks: openTasks, doneEvents: doneEvents
    };
  }

  function quickStats(mk) {
    const from = U.startOfMonth(mk), to = U.endOfMonth(mk);
    const occs = Store.occurrencesBetween(from, to);
    const t = Store.tasks().filter(function (x) {
      return (x.due && U.monthKey(x.due) === mk) || (x.doneDate && U.monthKey(x.doneDate) === mk);
    });
    const done = t.filter(function (x) { return x.done; });
    return {
      tasksDone: done.length,
      events: occs.length,
      rate: U.pct(done.length, t.length),
      collected: occs.filter(function (o) { return o.paid; }).reduce(function (s, o) { return s + Number(o.amount || 0); }, 0)
    };
  }

  function delta(n, suffix) {
    if (!n) return '<span class="delta same">= مثل الشهر الماضي</span>';
    const up = n > 0;
    return '<span class="delta ' + (up ? 'up' : 'down') + '">' + (up ? '▲ +' : '▼ ') +
      Math.abs(n) + (suffix || '') + '</span>';
  }

  function render(root) {
    const mk = Views.state.month;
    const r = analyze(mk);
    const cur = Store.settings().currency;
    const saved = Store.reportFor(mk) || {};
    const name = Store.settings().name;

    root.innerHTML = '' +
      '<section class="cal-head no-print">' +
        '<div class="cal-nav">' +
          '<button class="icon-btn" data-act="month-next">›</button>' +
          '<h2>تقرير ' + U.monthLabel(mk) + '</h2>' +
          '<button class="icon-btn" data-act="month-prev">‹</button>' +
        '</div>' +
        '<div class="cal-tools">' +
          '<button class="btn btn-sm" data-act="month-today">هذا الشهر</button>' +
          '<button class="btn btn-sm btn-primary" data-act="print-report">🖨 طباعة / PDF</button>' +
        '</div>' +
      '</section>' +

      '<article class="report" id="reportSheet">' +
        '<header class="report-head">' +
          '<h1>التقرير الشهري — ' + U.monthLabel(mk) + '</h1>' +
          '<p>' + (name ? U.escapeHTML(name) + ' · ' : '') + U.hijri(U.startOfMonth(mk)) + ' إلى ' + U.hijri(U.endOfMonth(mk)) + '</p>' +
          (r.isPast ? '' : '<p class="muted small">الشهر لم ينتهِ بعد — الأرقام حتى تاريخ اليوم.</p>') +
        '</header>' +

        '<section class="report-stats">' +
          Views.statCard('✅', r.totals.tasksDone + '/' + r.totals.tasks, 'مهام منجزة') +
          Views.statCard('📈', r.totals.completionRate + '٪', 'نسبة الإنجاز',
            r.totals.completionRate >= 75 ? 'ok' : (r.totals.completionRate < 50 ? 'danger' : 'warn')) +
          Views.statCard('📅', r.totals.events, 'التزامات ومواعيد') +
          Views.statCard('⏱', r.totals.hours + ' س', 'ساعات مجدولة') +
          Views.statCard('💵', U.money(r.totals.collected, cur), 'محصّل', 'ok') +
          Views.statCard('⏳', U.money(r.totals.pending, cur), 'غير محصّل', r.totals.pending ? 'warn' : '') +
        '</section>' +

        '<section class="report-block">' +
          '<h2>مقارنة بـ' + U.monthLabel(r.compare.month) + '</h2>' +
          '<div class="compare">' +
            '<div><small>المهام المنجزة</small>' + delta(r.compare.tasksDone) + '</div>' +
            '<div><small>نسبة الإنجاز</small>' + delta(r.compare.rate, '٪') + '</div>' +
            '<div><small>المواعيد</small>' + delta(r.compare.events) + '</div>' +
            '<div><small>المحصّل</small>' + delta(Math.round(r.compare.collected), ' ' + cur) + '</div>' +
          '</div>' +
        '</section>' +

        '<section class="report-block">' +
          '<h2>توزيع الشهر على مجالاتي</h2>' +
          '<div class="table-wrap"><table class="rep-table">' +
            '<thead><tr><th>المجال</th><th>مواعيد</th><th>ساعات</th><th>مهام</th><th>الإنجاز</th><th>محصّل</th></tr></thead>' +
            '<tbody>' + r.byCtx.map(function (x) {
              const dim = (!x.events && !x.tasks) ? ' class="dim"' : '';
              return '<tr' + dim + '>' +
                '<td><span class="dot" style="background:' + x.ctx.color + '"></span>' + U.escapeHTML(x.ctx.name) + '</td>' +
                '<td>' + x.events + '</td>' +
                '<td>' + (x.hours || '—') + '</td>' +
                '<td>' + x.tasksDone + '/' + x.tasks + '</td>' +
                '<td>' + (x.tasks ? '<span class="rate ' + (x.rate >= 75 ? 'ok' : (x.rate < 50 ? 'bad' : 'mid')) + '">' + x.rate + '٪</span>' : '—') + '</td>' +
                '<td>' + (x.collected ? U.money(x.collected, cur) : '—') + '</td>' +
              '</tr>';
            }).join('') + '</tbody>' +
          '</table></div>' +
        '</section>' +

        '<section class="report-block wins">' +
          '<h2>🏅 أبرز ما أنجزته</h2>' +
          (r.wins.length ? '<ul class="rep-list">' + r.wins.map(function (w) {
            return '<li>' + U.escapeHTML(w) + '</li>'; }).join('') + '</ul>'
            : '<p class="muted">ما فيه بيانات كافية لهذا الشهر.</p>') +
          (r.doneTasks.length ? '<details class="rep-details"><summary>قائمة المهام المنجزة (' + r.doneTasks.length + ')</summary>' +
            '<ul class="rep-list small">' + r.doneTasks.map(function (t) {
              return '<li>' + U.escapeHTML(t.title) + ' <span class="muted">— ' +
                U.escapeHTML(Store.context(t.contextId).name) +
                (t.doneDate ? ' · ' + U.fmtDate(t.doneDate) : '') + '</span></li>';
            }).join('') + '</ul></details>' : '') +
        '</section>' +

        '<section class="report-block issues">' +
          '<h2>⚠️ سلبيات لازم أتلافاها الشهر القادم</h2>' +
          (r.issues.length ? r.issues.map(function (i) {
            return '<div class="issue"><h3>' + U.escapeHTML(i.title) + '</h3>' +
              (i.detail ? '<p class="issue-detail">' + U.escapeHTML(i.detail) + '</p>' : '') +
              '<p class="issue-fix">↩ ' + U.escapeHTML(i.fix) + '</p></div>';
          }).join('') : '<p class="muted">لا شيء.</p>') +
        '</section>' +

        '<section class="report-block">' +
          '<h2>🎯 توصيات للشهر القادم</h2>' +
          '<ol class="rep-list">' + r.recs.map(function (x) { return '<li>' + U.escapeHTML(x) + '</li>'; }).join('') + '</ol>' +
        '</section>' +

        '<section class="report-block">' +
          '<h2>✍️ ملاحظاتي الشخصية</h2>' +
          '<textarea id="repNotes" class="rep-notes no-print" rows="4" placeholder="اكتب هنا ما لا تلتقطه الأرقام: الحالة النفسية، الفرص، القرارات...">' +
            U.escapeHTML(saved.notes || '') + '</textarea>' +
          (saved.notes ? '<p class="print-only rep-notes-print">' + U.escapeHTML(saved.notes) + '</p>' : '') +
          '<div class="btn-row no-print"><button class="btn btn-sm btn-primary" id="saveRep">حفظ التقرير في الأرشيف</button></div>' +
        '</section>' +

        '<footer class="report-foot">أُنشئ في ' + U.fmtDate(U.todayISO(), { long: true }) + '</footer>' +
      '</article>' +

      (Store.reports().length ? '<section class="block no-print">' +
        UI.sectionTitle('الأرشيف') +
        '<div class="archive">' + Store.reports().slice().sort(function (a, b) {
          return a.month < b.month ? 1 : -1;
        }).map(function (x) {
          return '<button class="archive-item" data-report="' + x.month + '">' + U.monthLabel(x.month) +
            '<small>' + x.tasksDone + ' مهمة · ' + x.completionRate + '٪</small></button>';
        }).join('') + '</div>' +
      '</section>' : '');

    const btn = root.querySelector('#saveRep');
    if (btn) btn.onclick = function () {
      Store.saveReport({
        month: mk,
        notes: root.querySelector('#repNotes').value,
        tasksDone: r.totals.tasksDone,
        completionRate: r.totals.completionRate,
        collected: r.totals.collected,
        savedAt: Date.now()
      });
      UI.toast('تم حفظ التقرير في الأرشيف ✔');
      App.render();
    };

    root.querySelectorAll('[data-report]').forEach(function (b) {
      b.onclick = function () { Views.state.month = b.dataset.report; App.render(); };
    });
  }

  global.Report = { analyze, render, quickStats };
})(window);
/* التشغيل والتوجيه بين الشاشات */
(function (global) {
  'use strict';

  const appEl = document.getElementById('app');
  const tabsEl = document.getElementById('tabs');
  const bannerEl = document.getElementById('banner');
  let currentView = 'today';

  const VIEWS = {
    today: Views.today, calendar: Views.calendar, tasks: Views.tasks,
    money: Views.money, report: Report.render, settings: Views.settings
  };

  function render() {
    appEl.innerHTML = '';
    if (!VIEWS[currentView]) currentView = 'today';
    VIEWS[currentView](appEl);
    Array.from(tabsEl.children).forEach(function (b) {
      b.classList.toggle('is-active', b.dataset.view === currentView);
    });
    document.getElementById('todayLabel').textContent = U.fmtDate(U.todayISO()) + ' · ' + U.hijri(U.todayISO());
    const nm = Store.settings().name;
    document.getElementById('brandName').textContent = nm ? 'منصّة ' + nm : 'منصّتي';
    appEl.scrollTop = 0;
  }

  function go(view) {
    currentView = view;
    location.hash = view;
    render();
  }

  /* ------- التنقّل ------- */
  tabsEl.addEventListener('click', function (e) {
    const b = e.target.closest('[data-view]');
    if (b) go(b.dataset.view);
  });

  window.addEventListener('hashchange', function () {
    const v = location.hash.replace('#', '');
    if (v && v !== currentView) { currentView = v; render(); }
  });

  /* ------- الأفعال العامة (تفويض الأحداث) ------- */
  document.addEventListener('click', function (e) {
    const actEl = e.target.closest('[data-act]');
    const dayEl = e.target.closest('[data-day]');
    const ctxRow = e.target.closest('[data-ctx]');

    if (dayEl && !actEl) {
      Views.state.selectedDate = dayEl.dataset.day;
      render();
      return;
    }

    if (ctxRow && !actEl) {
      const c = Store.context(ctxRow.dataset.ctx);
      Forms.openContextForm(c, render);
      return;
    }

    if (!actEl) return;
    const act = actEl.dataset.act;
    const card = actEl.closest('[data-ev]');
    const taskCard = actEl.closest('[data-task]');

    switch (act) {
      case 'add-event-today':
        Forms.openEventForm(null, U.todayISO(), render); break;
      case 'add-event-day':
        Forms.openEventForm(null, Views.state.selectedDate, render); break;
      case 'add-task':
        Forms.openTaskForm(null, render); break;
      case 'add-context':
        Forms.openContextForm(null, render); break;

      case 'ev-done': {
        const ev = Store.event(card.dataset.ev);
        const date = card.dataset.date;
        const inst = Store.materialize(ev, date);
        Store.setOccurrence(ev.id, date, { status: inst.status === 'done' ? 'planned' : 'done' });
        UI.toast(inst.status === 'done' ? 'رجّعناه غير منجز' : 'تم ✔');
        render(); break;
      }
      case 'ev-paid': {
        const ev = Store.event(card.dataset.ev);
        const date = card.dataset.date;
        const inst = Store.materialize(ev, date);
        Store.setOccurrence(ev.id, date, { paid: !inst.paid });
        UI.toast(!inst.paid ? 'تم تسجيل التحصيل 💵' : 'رجّعناه غير محصّل');
        render(); break;
      }
      case 'ev-missed': {
        const ev = Store.event(card.dataset.ev);
        const date = card.dataset.date;
        const inst = Store.materialize(ev, date);
        Store.setOccurrence(ev.id, date, { status: inst.status === 'missed' ? 'planned' : 'missed' });
        UI.toast(inst.status === 'missed' ? 'أُلغي التعليم' : 'سُجّل أنه فات');
        render(); break;
      }
      case 'ev-edit': {
        const ev = Store.event(card.dataset.ev);
        Forms.openEventForm(ev, null, render); break;
      }
      case 'task-toggle': {
        const t = Store.toggleTask(taskCard.dataset.task);
        UI.toast(t.done ? 'أحسنت — أُنجزت ✔' : 'رجعت مفتوحة');
        render(); break;
      }
      case 'task-edit':
        Forms.openTaskForm(Store.task(taskCard.dataset.task), render); break;

      case 'month-prev':
        Views.state.month = U.shiftMonth(Views.state.month, -1);
        Views.state.selectedDate = U.startOfMonth(Views.state.month);
        render(); break;
      case 'month-next':
        Views.state.month = U.shiftMonth(Views.state.month, 1);
        Views.state.selectedDate = U.startOfMonth(Views.state.month);
        render(); break;
      case 'month-today':
        Views.state.month = U.monthKey(U.todayISO());
        Views.state.selectedDate = U.todayISO();
        render(); break;

      case 'print-report': window.print(); break;

      case 'export': exportData(); break;
      case 'import': openImport(); break;
      case 'reset':
        UI.confirmBox('سيتم مسح كل المواعيد والمهام والتقارير من هذا الجهاز. متأكد؟', function () {
          Store.resetAll(); UI.toast('تم المسح'); render();
        });
        break;
      case 'open-report':
        Views.state.month = actEl.dataset.month || U.shiftMonth(U.monthKey(U.todayISO()), -1);
        go('report'); break;
      case 'dismiss-banner':
        Store.saveSettings({ lastSeenMonth: U.monthKey(U.todayISO()) });
        bannerEl.classList.add('hidden'); break;
    }
  });

  /* ------- استيراد / تصدير ------- */
  async function exportData() {
    const json = Store.exportJSON();
    const filename = 'نسخة-منصتي-' + U.todayISO() + '.json';

    // في النسخة المستضافة يمرّ الحفظ عبر تأكيد من المتصفّح
    if (global.claude && typeof global.claude.use === 'function') {
      try {
        const downloads = await global.claude.use('downloads');
        if (downloads) {
          await downloads.save({ filename: filename, data: json });
          UI.toast('نُزّلت النسخة الاحتياطية');
          return;
        }
      } catch (err) {
        if (err && err.code === 'declined') { UI.toast('أُلغي التنزيل'); return; }
        if (err && err.code === 'rate_limited') { UI.toast('انتظر لحظة ثم أعد المحاولة', 'err'); return; }
        // خلاف ذلك نكمل بالطريقة الاعتيادية
      }
    }

    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    UI.toast('نُزّلت النسخة الاحتياطية');
  }

  function applyImport(text) {
    try {
      Store.importJSON(text);
      UI.closeModal();
      UI.toast('تم الاستيراد ✔');
      render();
    } catch (err) {
      UI.toast('الملف غير صالح — تأكد أنه ملف النسخة الاحتياطية', 'err');
    }
  }

  function openImport() {
    UI.openModal('استيراد نسخة احتياطية',
      '<p class="muted small">اختر ملف النسخة، أو الصق محتواه هنا إن لم يفتح المتصفّح نافذة الملفات.</p>' +
      '<div class="btn-row"><button class="btn" id="pickFile">📂 اختيار ملف</button></div>' +
      '<label class="field mt"><span>أو ألصق محتوى الملف</span>' +
        '<textarea id="pasteJson" rows="6" placeholder="{ &quot;version&quot;: 1, ... }"></textarea></label>' +
      '<div class="form-actions"><button class="btn btn-primary" id="doImport">استيراد</button>' +
        '<button class="btn btn-ghost" data-close>إلغاء</button></div>',
      function (root) {
        root.querySelector('#pickFile').onclick = function () {
          document.getElementById('importFile').click();
        };
        root.querySelector('#doImport').onclick = function () {
          const v = root.querySelector('#pasteJson').value.trim();
          if (!v) { UI.toast('ألصق المحتوى أولًا', 'err'); return; }
          applyImport(v);
        };
      });
  }

  document.addEventListener('change', function (e) {
    if (e.target.id !== 'importFile') return;
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () { applyImport(reader.result); };
    reader.readAsText(file);
  });

  /* ------- تنبيه بداية الشهر: تقرير الشهر الماضي جاهز ------- */
  function checkMonthBanner() {
    const nowMk = U.monthKey(U.todayISO());
    const s = Store.settings();
    if (s.lastSeenMonth !== nowMk) {
      const prev = U.shiftMonth(nowMk, -1);
      bannerEl.innerHTML = '<span>📊 تقرير <strong>' + U.monthLabel(prev) + '</strong> جاهز — راجع إنجازاتك وما يحتاج تحسينًا.</span>' +
        '<span class="banner-actions">' +
        '<button class="btn btn-sm btn-primary" data-act="open-report" data-month="' + prev + '">افتح التقرير</button>' +
        '<button class="icon-btn" data-act="dismiss-banner">✕</button></span>';
      bannerEl.classList.remove('hidden');
    }
  }

  /* ------- المظهر ------- */
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme() {
    const t = Store.settings().theme || 'auto';
    document.documentElement.setAttribute('data-theme', t === 'auto' ? '' : t);
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  }
  themeBtn.addEventListener('click', function () {
    const order = ['auto', 'light', 'dark'];
    const cur = Store.settings().theme || 'auto';
    const next = order[(order.indexOf(cur) + 1) % order.length];
    Store.saveSettings({ theme: next });
    applyTheme();
    UI.toast(next === 'auto' ? 'المظهر: تلقائي' : (next === 'light' ? 'المظهر: فاتح' : 'المظهر: داكن'));
  });

  document.getElementById('quickAdd').addEventListener('click', function () {
    Forms.openQuickAdd(currentView === 'calendar' ? Views.state.selectedDate : U.todayISO(), render);
  });

  /* ------- الإقلاع ------- */
  Store.load();
  applyTheme();
  const hash = location.hash.replace('#', '');
  if (hash) currentView = hash;
  render();
  checkMonthBanner();


  global.App = { render: render, go: go };
})(window);
</script>
</body>
</html>
