<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>منصّتي — تنظيم كل أشغالي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark">🗂️</span>
      <div>
        <strong id="brandName">منصّتي</strong>
        <small id="todayLabel"></small>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" id="quickAdd">+ إضافة</button>
      <button class="icon-btn" id="themeToggle" title="تبديل المظهر">🌗</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="today" class="tab is-active">اليوم</button>
    <button data-view="calendar" class="tab">التقويم</button>
    <button data-view="tasks" class="tab">المهام</button>
    <button data-view="money" class="tab">المالية</button>
    <button data-view="report" class="tab">التقرير الشهري</button>
    <button data-view="settings" class="tab">الإعدادات</button>
  </nav>
</header>

<div id="banner" class="banner hidden"></div>

<main id="app" class="app"></main>

<div class="modal-root hidden" id="modalRoot">
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" data-close aria-label="إغلاق">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="assets/util.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/forms.js"></script>
<script src="assets/views.js"></script>
<script src="assets/report.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
